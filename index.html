<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>DicoTus</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: #f4f5f7;
      color: #222;
      --word-length: 5;
    }

    .container {
      width: 100%;
      max-width: 650px;
      margin: 0 auto;
      padding: 20px 15px 40px;
    }

    h1 {
      text-align: center;
      margin: 5px 0 5px;
      font-size: 38px;
      color: #222;
    }

    .subtitle {
      text-align: center;
      color: #666;
      margin-bottom: 25px;
    }

    .card {
      background: white;
      border-radius: 16px;
      padding: 20px;
      margin-bottom: 18px;
      box-shadow: 0 3px 12px rgba(0,0,0,0.08);
    }

    .hidden {
      display: none !important;
    }

    /* PSEUDO */

    #pseudoSection {
      text-align: center;
    }

    #pseudoInput {
      width: 100%;
      max-width: 350px;
      padding: 14px;
      border: 2px solid #ddd;
      border-radius: 10px;
      font-size: 18px;
      text-align: center;
      margin-bottom: 12px;
    }

    button {
      border: none;
      border-radius: 10px;
      padding: 13px 20px;
      font-size: 17px;
      font-weight: bold;
      cursor: pointer;
      background: #222;
      color: white;
    }

    button:hover {
      opacity: 0.9;
    }

    button:disabled {
      opacity: 0.5;
      cursor: not-allowed;
    }

    /* INFOS DU JEU */

    .game-title {
      text-align: center;
      font-size: 25px;
      font-weight: bold;
      margin-bottom: 5px;
    }

    .date {
      text-align: center;
      color: #777;
      font-size: 14px;
      margin-bottom: 15px;
    }

    .word-length {
      text-align: center;
      font-size: 21px;
      font-weight: bold;
      margin: 15px 0 22px;
    }

    .word-length span {
      color: #1976d2;
    }

    /* INDICATION AVANT / APRES */

    #message {
      min-height: 48px;
      display: flex;
      align-items: center;
      justify-content: center;
      text-align: center;
      border-radius: 10px;
      font-size: 18px;
      font-weight: bold;
      margin: 15px 0;
      padding: 10px;
    }

    .message-info {
      background: #eef3f8;
      color: #444;
    }

    .message-before {
      background: #fff3cd;
      color: #856404;
    }

    .message-after {
      background: #dbeafe;
      color: #1e40af;
    }

    .message-success {
      background: #d9f7df;
      color: #176b2c;
    }

    .message-error {
      background: #fde2e2;
      color: #a12222;
    }

    /* SAISIE */

    .input-label {
      display: block;
      font-weight: bold;
      margin-bottom: 7px;
    }

    .guess-row {
      display: flex;
      gap: 8px;
    }

    #guessButton {
      padding-left: 18px;
      padding-right: 18px;
    }


    .guess-boxes {
      display: grid;
      grid-template-columns: repeat(var(--word-length), minmax(0, 46px));
      gap: 5px;
      justify-content: center;
    }

    .guess-box {
      aspect-ratio: 1;
      min-width: 0;
      border: 2px solid #cfd5dc;
      border-radius: 6px;
      background: white;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: clamp(0.85rem, 4.5vw, 1.3rem);
      font-weight: bold;
      color: #222;
      user-select: none;
      text-transform: uppercase;
    }

    .guess-box.active {
      border-color: #1976d2;
      box-shadow: 0 0 0 2px rgba(25,118,210,.12);
      background: #f8fbff;
    }

    .guess-box.known {
      background: #1976d2;
      color: white;
      border-color: #1976d2;
    }

    .guess-box.filled {
      border-color: #1976d2;
    }

    .keyboard {
      display: grid;
      grid-template-columns: repeat(10, 1fr);
      gap: 5px;
      max-width: 560px;
      margin: 8px auto 14px;
    }

    .key {
      min-width: 0;
      height: 42px;
      padding: 0;
      border-radius: 7px;
      border: 1px solid #d3d8de;
      background: #eef1f4;
      color: #222;
      font-size: 15px;
      font-weight: bold;
      cursor: pointer;
      touch-action: manipulation;
    }

    .key.possible {
      background: #1976d2;
      color: white;
      border-color: #1976d2;
    }

    .key.boundary {
      background: #43a047;
      color: white;
      border-color: #43a047;
    }

    .key:disabled {
      opacity: .28;
      cursor: not-allowed;
    }

    .key.action {
      background: #555;
      color: white;
      border-color: #555;
      grid-column: span 2;
    }

    .guess-actions {
      display: flex;
      justify-content: center;
      gap: 8px;
      margin-top: 4px;
    }

    .guess-actions button {
      min-width: 110px;
    }

    .secondary-button {
      background: #e5e7eb;
      color: #222;
    }

    .attempts {
      text-align: center;
      margin-top: 12px;
      color: #666;
      font-size: 14px;
    }

    /* GRILLE AVANT / CIBLE / APRES */

    .bounds-title {
      font-weight: bold;
      margin-bottom: 12px;
      text-align: center;
    }

    .bound-block {
      margin-bottom: 10px;
    }

    .bound-caption {
      text-align: center;
      font-size: 12px;
      font-weight: bold;
      color: #999;
      text-transform: uppercase;
      letter-spacing: 0.5px;
      margin-bottom: 6px;
    }

    .bound-row {
      display: grid;
      grid-template-columns: repeat(var(--word-length), minmax(0, 46px));
      gap: 5px;
      justify-content: center;
    }

    .bound-tile {
      aspect-ratio: 1;
      min-width: 0;
      display: flex;
      align-items: center;
      justify-content: center;
      font-weight: bold;
      font-size: clamp(0.85rem, 4.5vw, 1.3rem);
      border-radius: 6px;
      text-transform: uppercase;
      border: 2px solid transparent;
    }

    .bound-tile.empty {
      background: #f1f3f5;
      border: 2px dashed #dcdfe3;
      color: #ccc;
    }

    .bound-tile.before {
      background: #fff3cd;
      color: #856404;
      border-color: #f4dd8f;
    }

    .bound-tile.after {
      background: #dbeafe;
      color: #1e40af;
      border-color: #b7d1fb;
    }

    .bound-tile.known {
      background: #1976d2;
      color: white;
      border-color: #1976d2;
    }

    .bound-tile.unknown {
      background: white;
      border: 2px solid #ccc;
      color: #ccc;
    }

    .bound-divider {
      text-align: center;
      color: #bbb;
      font-size: 8px;
      margin: 4px 0;
    }

    /* RESULTAT */

    #result {
      text-align: center;
    }

    .result-title {
      font-size: 26px;
      font-weight: bold;
      margin-bottom: 10px;
    }

    .result-word {
      font-size: 30px;
      font-weight: bold;
      letter-spacing: 3px;
      margin: 15px 0;
    }

    .result-points {
      font-size: 20px;
      font-weight: bold;
      color: #1976d2;
    }

    /* CLASSEMENT */

    .leaderboard-title {
      text-align: center;
      font-size: 23px;
      font-weight: bold;
      margin-bottom: 15px;
    }

    .leaderboard-row {
      display: grid;
      grid-template-columns: 45px 1fr 70px;
      align-items: center;
      padding: 10px 5px;
      border-bottom: 1px solid #eee;
    }

    .leaderboard-row:last-child {
      border-bottom: none;
    }

    .rank {
      font-weight: bold;
      color: #777;
    }

    .player {
      font-weight: bold;
    }

    .points {
      text-align: right;
      font-weight: bold;
    }

    .loading {
      text-align: center;
      color: #777;
      padding: 15px;
    }

    .small-note {
      text-align: center;
      color: #888;
      font-size: 12px;
      margin-top: 15px;
    }

    @media (max-width: 480px) {

      .container {
        padding: 12px 10px 30px;
      }

      h1 {
        font-size: 32px;
      }

      .card {
        padding: 15px;
      }

      .keyboard { gap: 4px; }
      .key { height: 39px; font-size: 13px; }
      .guess-actions button { flex: 1; }
    }
  </style>
</head>

<body>

<div class="container">

  <h1>DICO</h1>
  <div class="subtitle">Trouve le mot mystère</div>

  <!-- ========================= -->
  <!-- PSEUDO -->
  <!-- ========================= -->

  <div id="pseudoSection" class="card">

    <h2>Bienvenue !</h2>

    <p>Choisis simplement un pseudo pour jouer.</p>

    <input
      type="text"
      id="pseudoInput"
      maxlength="20"
      placeholder="Ton pseudo"
      autocomplete="off"
    >

    <br>

    <button id="startButton">
      Jouer
    </button>

  </div>


  <!-- ========================= -->
  <!-- JEU -->
  <!-- ========================= -->

  <div id="gameSection" class="hidden">

    <div class="card">

      <div class="game-title">
        Le mot du jour
      </div>

      <div class="date" id="todayDate"></div>

      <div class="word-length">
        Mot mystère : <span id="wordLength"></span> lettres
      </div>



























    <!-- ========================= -->
    <!-- GRILLE AVANT / CIBLE / APRES -->
    <!-- ========================= -->

    <div class="card">

      <div class="bounds-title">
        Où se situe le mot mystère ?
      </div>

      <div class="bound-block">
        <div class="bound-caption">↑ Mot d'avant</div>
        <div id="rowBefore" class="bound-row"></div>
      </div>

      <div class="bound-divider">···</div>

      <div class="bound-block">
        <div class="bound-caption">Ton mot</div>
        <div id="guessBoxes" class="guess-boxes" aria-label="Saisie du mot"></div>
      </div>

      <div class="bound-divider">···</div>

      <div class="bound-block">
        <div id="rowAfter" class="bound-row"></div>
        <div class="bound-caption" style="margin-top:6px;">↓ Mot d'après</div>
      </div>
      

      <!-- MESSAGE -->

      <div id="message" class="message-info">
        Propose un mot !
      </div>


      <!-- SAISIE -->

      <div class="keyboard" id="virtualKeyboard" aria-label="Clavier virtuel"></div>
      <div class="guess-actions">
        <button id="backspaceButton" class="secondary-button" type="button">⌫</button>
        <button id="guessButton" type="button">Valider</button>
      </div>

      <div class="attempts">
        Tentatives : <span id="attemptCount">0</span>
      </div>

    </div>


    </div>


    <!-- ========================= -->
    <!-- RESULTAT -->
    <!-- ========================= -->

    <div id="result" class="card hidden">

      <div class="result-title" id="resultTitle"></div>

      <div>
        Le mot était :
      </div>

      <div class="result-word" id="resultWord"></div>

      <div class="result-points" id="resultPoints"></div>

    </div>


    <!-- ========================= -->
    <!-- CLASSEMENT -->
    <!-- ========================= -->

    <div class="card">

      <div class="leaderboard-title">
        🏆 Classement
      </div>

      <div id="leaderboard">
        <div class="loading">
          Chargement...
        </div>
      </div>

    </div>

  </div>

</div>


<script type="module">

  /* ============================================================
     FIREBASE
     ============================================================ */

  import {
    initializeApp
  } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";

  import {
    getFirestore,
    doc,
    getDoc,
    setDoc,
    updateDoc,
    collection,
    query,
    orderBy,
    limit,
    getDocs,
    increment
  } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";


  const firebaseConfig = {

    apiKey: "AIzaSyAPOWsMjLLVOwboJuvcxdYrCTwh2yT9mJM",

    authDomain: "dicotus-adbec.firebaseapp.com",

    projectId: "dicotus-adbec",

    storageBucket: "dicotus-adbec.firebasestorage.app",

    messagingSenderId: "399883509375",

    appId: "1:399883509375:web:2765aaf0f2e176a85d694a",

    measurementId: "G-1MGRJZ03HN"

  };


  const app = initializeApp(firebaseConfig);

  const db = getFirestore(app);


  /* ============================================================
     CONFIGURATION
     ============================================================ */

  const START_DATE = "2026-09-23";

  const MAX_ATTEMPTS = 20;

  const RESULTS_COLLECTION = "dicoResults";

  const PLAYERS_COLLECTION = "players";


  /* ============================================================
     VARIABLES
     ============================================================ */

  let secretWords = [];

  let acceptedWords = new Set();

  let secretWord = "";

  let wordLength = 0;

  let pseudo = "";

  let attempts = 0;

  let guesses = [];

  let lowerBound = null;

  let upperBound = null;

  let gameFinished = false;
  let currentGuess = [];
  let activePosition = 0;


  /* ============================================================
     ELEMENTS HTML
     ============================================================ */

  const pseudoSection =
    document.getElementById("pseudoSection");

  const gameSection =
    document.getElementById("gameSection");

  const pseudoInput =
    document.getElementById("pseudoInput");

  const startButton =
    document.getElementById("startButton");

  const guessBoxes = document.getElementById("guessBoxes");
  const virtualKeyboard = document.getElementById("virtualKeyboard");
  const backspaceButton = document.getElementById("backspaceButton");

  const guessButton =
    document.getElementById("guessButton");

  const message =
    document.getElementById("message");

  const rowBefore =
    document.getElementById("rowBefore");

  const rowAfter =
    document.getElementById("rowAfter");

  const attemptCount =
    document.getElementById("attemptCount");

  const wordLengthElement =
    document.getElementById("wordLength");

  const todayDate =
    document.getElementById("todayDate");

  const result =
    document.getElementById("result");

  const resultTitle =
    document.getElementById("resultTitle");

  const resultWord =
    document.getElementById("resultWord");

  const resultPoints =
    document.getElementById("resultPoints");

  const leaderboard =
    document.getElementById("leaderboard");


  /* ============================================================
     NORMALISATION
     ============================================================ */

  function normalizeWord(word) {

    return String(word)
      .trim()
      .toUpperCase()
      .normalize("NFD")
      .replace(/[\u0300-\u036f]/g, "")
      .replace(/[^A-Z]/g, "");

  }


  /* ============================================================
     COMPARAISON ALPHABETIQUE
     ============================================================ */

  function compareWords(a, b) {

    return a.localeCompare(
      b,
      "fr",
      {
        sensitivity: "base"
      }
    );

  }


  /* ============================================================
     EXTRACTION DES MOTS D'UN JSON
     ============================================================ */

  function extractWords(data) {

    let words = [];

    if (Array.isArray(data)) {

      words = data;

    } else if (data && Array.isArray(data.words)) {

      words = data.words;

    } else if (data && Array.isArray(data.mots)) {

      words = data.mots;

    } else if (data && Array.isArray(data.wordsOfTheDay)) {

      words = data.wordsOfTheDay;

    }

    return words
      .map(normalizeWord)
      .filter(word => word.length > 0);

  }


  /* ============================================================
     CHARGEMENT MOTS DU JOUR
     ============================================================ */

  async function loadSecretWords() {

    const response =
      await fetch("mots_du_jour.json", {
        cache: "no-cache"
      });

    if (!response.ok) {

      throw new Error(
        "Impossible de charger mot_du_jour.json"
      );

    }

    const data =
      await response.json();

    secretWords =
      extractWords(data);

    if (secretWords.length === 0) {

      throw new Error(
        "mot_du_jour.json ne contient aucun mot."
      );

    }

  }


  /* ============================================================
     CHARGEMENT MOTS ACCEPTES
     ============================================================ */

  async function loadAcceptedWords() {

    const response =
      await fetch("mots_acceptes.json", {
        cache: "no-cache"
      });

    if (!response.ok) {

      throw new Error(
        "Impossible de charger mot_acceptes.json"
      );

    }

    const data =
      await response.json();

    const words =
      extractWords(data);

    acceptedWords =
      new Set(words);


    /*
       Les mots du jour sont également considérés
       comme des mots valides.
    */

    for (const word of secretWords) {

      acceptedWords.add(word);

    }

  }


  /* ============================================================
     CALCUL DU MOT DU JOUR
     ============================================================ */

  function getTodayWord() {

    const today =
      new Date();

    const start =
      new Date(START_DATE + "T00:00:00");

    const todayUTC =
      Date.UTC(
        today.getFullYear(),
        today.getMonth(),
        today.getDate()
      );

    const startUTC =
      Date.UTC(
        start.getFullYear(),
        start.getMonth(),
        start.getDate()
      );

    const diff =
      Math.floor(
        (todayUTC - startUTC)
        /
        (1000 * 60 * 60 * 24)
      );

    const index =
      ((diff % secretWords.length)
      + secretWords.length)
      % secretWords.length;

    return secretWords[index];

  }


  /* ============================================================
     ID DU JOUEUR
     ============================================================ */

  function getPseudoId() {

    return normalizeWord(pseudo)
      .toLowerCase()
      .replace(/[^a-z0-9]/g, "_");

  }


  /* ============================================================
     ID DE LA PARTIE
     ============================================================ */

  function getGameId() {

    const today =
      getDateString();

    return today + "_" + getPseudoId();

  }


  /* ============================================================
     DATE DU JOUR
     ============================================================ */

  function getDateString() {

    const now =
      new Date();

    const year =
      now.getFullYear();

    const month =
      String(now.getMonth() + 1)
        .padStart(2, "0");

    const day =
      String(now.getDate())
        .padStart(2, "0");

    return `${year}-${month}-${day}`;

  }


  /* ============================================================
     AFFICHAGE DATE
     ============================================================ */

  function displayDate() {

    const date =
      new Date();

    todayDate.textContent =
      date.toLocaleDateString(
        "fr-FR",
        {
          weekday: "long",
          day: "numeric",
          month: "long",
          year: "numeric"
        }
      );

  }


  /* ============================================================
     ALPHABET
     ============================================================ */

  function getKnownPrefix() {
    if (!lowerBound || !upperBound) return "";
    const a = normalizeWord(lowerBound);
    const b = normalizeWord(upperBound);
    let prefix = "";
    for (let i = 0; i < wordLength; i++) {
      if (a[i] && a[i] === b[i]) prefix += a[i];
      else break;
    }
    return prefix;
  }

  function getPossibleLettersAtPosition(position) {
    const possible = new Set();
    const prefix = getKnownPrefix();

    if (position < prefix.length) {
      possible.add(prefix[position]);
      return possible;
    }

    for (const word of acceptedWords) {
      if (word.length !== wordLength) continue;
      if (lowerBound && compareWords(word, lowerBound) <= 0) continue;
      if (upperBound && compareWords(word, upperBound) >= 0) continue;

      let compatible = true;
      for (let i = 0; i < position; i++) {
        if (currentGuess[i] && word[i] !== currentGuess[i]) {
          compatible = false;
          break;
        }
      }
      if (compatible && word[position]) possible.add(word[position]);
    }

    if (secretWord && secretWord[position]) possible.add(secretWord[position]);

    if (!possible.size) {
      "ABCDEFGHIJKLMNOPQRSTUVWXYZ".split("").forEach(l => possible.add(l));
    }
    return possible;
  }

  function renderVirtualKeyboard() {
    virtualKeyboard.innerHTML = "";
    const letters = "AZERTYUIOPQSDFGHJKLMWXCVBN".split("");
    const knownPrefix = getKnownPrefix();
    const position = Math.min(knownPrefix.length, Math.max(0, wordLength - 1));
    const isAtRestrictedPosition = activePosition === position;
    const possible = isAtRestrictedPosition
      ? getPossibleLettersAtPosition(position)
      : null;

    letters.forEach(letter => {
      const key = document.createElement("button");
      key.type = "button";
      key.className = "key";
      key.textContent = letter;

      if (isAtRestrictedPosition) {
        const isPossible = possible.has(letter);
        const isKnown = position < knownPrefix.length && knownPrefix[position] === letter;

        if (isKnown) key.classList.add("boundary");
        else if (isPossible) key.classList.add("possible");
        else key.disabled = true;
      }

      key.addEventListener("click", () => enterLetter(letter));
      virtualKeyboard.appendChild(key);
    });

    const erase = document.createElement("button");
    erase.type = "button";
    erase.className = "key action";
    erase.textContent = "⌫";
    erase.addEventListener("click", eraseLetter);
    virtualKeyboard.appendChild(erase);
  }

  function renderGuessBoxes() {
    guessBoxes.innerHTML = "";
    const knownPrefix = getKnownPrefix();

    for (let i = 0; i < wordLength; i++) {
      const box = document.createElement("div");
      box.className = "guess-box";

      if (i < knownPrefix.length) {
        box.classList.add("known");
        box.textContent = knownPrefix[i];
      } else {
        box.textContent = currentGuess[i] || "";
        if (currentGuess[i]) box.classList.add("filled");
        if (i === activePosition && !gameFinished) box.classList.add("active");
      }

      box.addEventListener("click", () => {
        if (gameFinished || i < knownPrefix.length) return;
        activePosition = i;
        renderGuessBoxes();
        renderVirtualKeyboard();
      });
      guessBoxes.appendChild(box);
    }
  }

  function syncGuessWithKnownPrefix() {
    const prefix = getKnownPrefix();
    for (let i = 0; i < prefix.length; i++) currentGuess[i] = prefix[i];
    activePosition = Math.max(prefix.length, Math.min(activePosition, Math.max(0, wordLength - 1)));
  }

  function enterLetter(letter) {
    if (gameFinished) return;
    const prefix = getKnownPrefix();
    if (activePosition < prefix.length) activePosition = prefix.length;

    if (
      activePosition === prefix.length &&
      !getPossibleLettersAtPosition(activePosition).has(letter)
    ) return;

    currentGuess[activePosition] = letter;
    if (activePosition < wordLength - 1) activePosition++;

    renderGuessBoxes();
    renderVirtualKeyboard();
  }

  function eraseLetter() {
    if (gameFinished) return;
    const prefix = getKnownPrefix();

    if (activePosition < prefix.length) activePosition = prefix.length;

    if (currentGuess[activePosition]) {
      currentGuess[activePosition] = "";
    } else if (activePosition > prefix.length) {
      activePosition--;
      currentGuess[activePosition] = "";
    }

    renderGuessBoxes();
    renderVirtualKeyboard();
  }

  function getCurrentGuess() {
    return currentGuess.join("");
  }


  /* ============================================================
     MESSAGE
     ============================================================ */

  function setMessage(
    text,
    type = "info"
  ) {

    message.textContent =
      text;

    message.className = "";

    message.id = "message";

    message.classList.add(
      "message-" + type
    );

  }


  /* ============================================================
     GRILLE AVANT / CIBLE / APRES

     Le mot d'avant et le mot d'après s'affichent tels quels.
     Pour le mot cible : puisque le mot secret est forcément
     compris entre les deux bornes dans l'ordre alphabétique,
     le préfixe COMMUN entre le mot d'avant et le mot d'après
     est garanti être le début exact du mot secret — c'est ce
     préfixe qui se dévoile progressivement.
     ============================================================ */

  function renderBoundsGrid() {

    document.body.style.setProperty(
      "--word-length",
      wordLength
    );


    syncGuessWithKnownPrefix();
    renderGuessBoxes();

    // Ligne du mot d'avant
    renderBoundRow(
      rowBefore,
      lowerBound,
      "before"
    );


    // Ligne du mot d'après
    renderBoundRow(
      rowAfter,
      upperBound,
      "after"
    );

  }


  function renderBoundRow(
    container,
    word,
    styleClass
  ) {

    container.innerHTML = "";

    for (let i = 0; i < wordLength; i++) {

      const tile =
        document.createElement("div");

      tile.className = "bound-tile";

      if (word) {

        tile.classList.add(styleClass);

        tile.textContent =
          normalizeWord(word)[i] || "";

      } else {

        tile.classList.add("empty");

        tile.textContent = "";

      }

      container.appendChild(tile);

    }

  }


  /* ============================================================
     SCORE
     ============================================================ */

  function calculatePoints() {

    /*
       Plus le mot est trouvé rapidement,
       plus le score est important.
    */

    return Math.max(
      1,
      MAX_ATTEMPTS + 1 - attempts
    );

  }


  /* ============================================================
     SAUVEGARDE PARTIE
     ============================================================ */

  async function saveGame() {

    const gameRef =
      doc(
        db,
        RESULTS_COLLECTION,
        getGameId()
      );


    await setDoc(
      gameRef,
      {
        pseudo: pseudo,
        date: getDateString(),
        wordLength: wordLength,
        attempts: attempts,
        guesses: guesses,
        lowerBound: lowerBound,
        upperBound: upperBound,
        finished: gameFinished,
        won:
          guesses.some(
            item => item.result === "correct"
          ),
        updatedAt: Date.now()
      },
      {
        merge: true
      }
    );

  }


  /* ============================================================
     CHARGEMENT PARTIE EXISTANTE
     ============================================================ */

  async function loadSavedGame() {

    const gameRef =
      doc(
        db,
        RESULTS_COLLECTION,
        getGameId()
      );

    const snapshot =
      await getDoc(gameRef);


    if (!snapshot.exists()) {

      return false;

    }


    const data =
      snapshot.data();


    attempts =
      data.attempts || 0;

    guesses =
      data.guesses || [];

    lowerBound =
      data.lowerBound || null;

    upperBound =
      data.upperBound || null;

    gameFinished =
      data.finished || false;


    attemptCount.textContent =
      attempts;

    renderBoundsGrid();

    renderVirtualKeyboard();


    if (gameFinished) {

      showFinishedGame(
        data.won === true
      );

    } else {

      setMessage(
        "Tu peux continuer ta partie.",
        "info"
      );

    }


    return true;

  }


  /* ============================================================
     FIN DE PARTIE
     ============================================================ */

  async function finishGame(won) {

    gameFinished = true;


    guessButton.disabled = true;


    const points =
      won
        ? calculatePoints()
        : 0;


    result.classList.remove("hidden");


    if (won) {

      resultTitle.textContent =
        "🎉 Bravo !";

      resultPoints.textContent =
        `Tu gagnes ${points} point${points > 1 ? "s" : ""}.`;

      setMessage(
        "Mot trouvé !",
        "success"
      );

    } else {

      resultTitle.textContent =
        "Partie terminée";

      resultPoints.textContent =
        "0 point";

      setMessage(
        "Dommage, le nombre maximum de tentatives est atteint.",
        "error"
      );

    }


    resultWord.textContent =
      secretWord;


    await saveGame();


    /*
       Mise à jour du classement.
    */

    const playerId =
      getPseudoId();

    const playerRef =
      doc(
        db,
        PLAYERS_COLLECTION,
        playerId
      );


    try {

      const playerSnapshot =
        await getDoc(playerRef);


      if (!playerSnapshot.exists()) {

        await setDoc(
          playerRef,
          {
            pseudo: pseudo,
            totalDicoPoints: points,
            dicoWins: won ? 1 : 0,
            dicoGames: 1
          }
        );

      } else {

        await updateDoc(
          playerRef,
          {
            totalDicoPoints:
              increment(points),

            dicoWins:
              increment(won ? 1 : 0),

            dicoGames:
              increment(1)
          }
        );

      }

    } catch (error) {

      console.error(
        "Erreur classement :",
        error
      );

    }


    loadLeaderboard();

  }


  /* ============================================================
     AFFICHAGE PARTIE TERMINEE
     ============================================================ */

  function showFinishedGame(won) {

    result.classList.remove("hidden");

    resultWord.textContent =
      secretWord;


    if (won) {

      resultTitle.textContent =
        "🎉 Partie déjà terminée";

      resultPoints.textContent =
        "Tu as déjà trouvé le mot aujourd'hui.";

      setMessage(
        "Tu as déjà joué aujourd'hui.",
        "success"
      );

    } else {

      resultTitle.textContent =
        "Partie déjà terminée";

      resultPoints.textContent =
        "Cette partie est terminée.";

      setMessage(
        "Tu as déjà terminé ta partie aujourd'hui.",
        "error"
      );

    }



    guessButton.disabled = true;

  }


  /* ============================================================
     PROPOSITION D'UN MOT
     ============================================================ */

  async function submitGuess() {

    if (gameFinished) {

      return;

    }


    const guess = getCurrentGuess();

    /* Mot vide / incomplet */
    if (!guess || guess.length !== wordLength) {

      setMessage(
        "Entre un mot.",
        "error"
      );

      return;

    }


    /* Mauvaise longueur */

    if (guess.length !== wordLength) {

      setMessage(
        `Le mot doit comporter ${wordLength} lettres.`,
        "error"
      );

      renderGuessBoxes();

      return;

    }


    /* Mot déjà proposé */

    if (
      guesses.some(
        item => item.word === guess
      )
    ) {

      setMessage(
        "Tu as déjà proposé ce mot.",
        "error"
      );

      renderGuessBoxes();

      return;

    }


    /*
       Vérification du dictionnaire.
    */

    if (!acceptedWords.has(guess)) {

      setMessage(
        "Ce mot n'est pas dans le dictionnaire.",
        "error"
      );

      renderGuessBoxes();

      return;

    }


    if (
      lowerBound &&
      compareWords(guess, lowerBound) <= 0
    ) {

      setMessage(
        `Le mot doit être après ${lowerBound}.`,
        "error"
      );

      renderGuessBoxes();

      return;

    }


    if (
      upperBound &&
      compareWords(guess, upperBound) >= 0
    ) {

      setMessage(
        `Le mot doit être avant ${upperBound}.`,
        "error"
      );

      renderGuessBoxes();

      return;

    }


    attempts++;

    attemptCount.textContent =
      attempts;


    /* ==========================================
       MOT TROUVÉ
       ========================================== */

    if (
      compareWords(
        guess,
        secretWord
      ) === 0
    ) {

      guesses.push({
        word: guess,
        result: "correct"
      });


      lowerBound = guess;
      upperBound = guess;

      renderBoundsGrid();

      renderVirtualKeyboard();

      await finishGame(true);

      return;

    }


    /* ==========================================
       AVANT
       ========================================== */

    if (
      compareWords(
        guess,
        secretWord
      ) < 0
    ) {

      lowerBound =
        guess;


      guesses.push({
        word: guess,
        result: "before"
      });


      setMessage(
        "AVANT le mot mystère",
        "before"
      );

    }


    /* ==========================================
       APRÈS
       ========================================== */

    else {

      upperBound =
        guess;


      guesses.push({
        word: guess,
        result: "after"
      });


      setMessage(
        "APRÈS le mot mystère",
        "after"
      );

    }


    renderBoundsGrid();

    renderVirtualKeyboard();


    await saveGame();


    if (
      attempts >= MAX_ATTEMPTS
    ) {

      await finishGame(false);

      return;

    }


    currentGuess = [];

    renderGuessBoxes();

  }


  /* ============================================================
     CLASSEMENT
     ============================================================ */

  async function loadLeaderboard() {

    leaderboard.innerHTML =
      `<div class="loading">Chargement...</div>`;


    try {

      const playersRef =
        collection(
          db,
          PLAYERS_COLLECTION
        );


      const q =
        query(
          playersRef,
          orderBy(
            "totalDicoPoints",
            "desc"
          ),
          limit(50)
        );


      const snapshot =
        await getDocs(q);


      leaderboard.innerHTML = "";


      if (snapshot.empty) {

        leaderboard.innerHTML =
          `<div class="loading">
             Aucun joueur pour le moment.
           </div>`;

        return;

      }


      let rank = 1;


      snapshot.forEach(docSnapshot => {

        const data =
          docSnapshot.data();


        const row =
          document.createElement("div");

        row.className =
          "leaderboard-row";


        const rankElement =
          document.createElement("div");

        rankElement.className =
          "rank";

        rankElement.textContent =
          rank + ".";


        const playerElement =
          document.createElement("div");

        playerElement.className =
          "player";

        playerElement.textContent =
          data.pseudo || "Joueur";


        const pointsElement =
          document.createElement("div");

        pointsElement.className =
          "points";

        pointsElement.textContent =
          `${data.totalDicoPoints || 0} pts`;


        row.appendChild(
          rankElement
        );

        row.appendChild(
          playerElement
        );

        row.appendChild(
          pointsElement
        );


        leaderboard.appendChild(row);


        rank++;

      });

    } catch (error) {

      console.error(
        "Erreur classement :",
        error
      );


      leaderboard.innerHTML =
        `<div class="loading">
           Impossible de charger le classement.
         </div>`;

    }

  }


  /* ============================================================
     DEMARRAGE DU JEU
     ============================================================ */

  async function startGame() {

    const enteredPseudo =
      pseudoInput.value.trim();


    if (!enteredPseudo) {

      alert(
        "Entre un pseudo."
      );

      pseudoInput.focus();

      return;

    }


    pseudo =
      enteredPseudo;


    localStorage.setItem(
      "dicoPseudo",
      pseudo
    );


    startButton.disabled =
      true;


    try {

      await loadSecretWords();

      await loadAcceptedWords();


      secretWord =
        getTodayWord();


      wordLength =
        secretWord.length;


      wordLengthElement.textContent =
        wordLength;


      displayDate();


      pseudoSection.classList.add(
        "hidden"
      );

      gameSection.classList.remove(
        "hidden"
      );


      renderBoundsGrid();


      await loadSavedGame();


      await loadLeaderboard();


      if (!gameFinished) {

        renderGuessBoxes();

      }

    } catch (error) {

      console.error(error);


      alert(
        error.message
        ||
        "Une erreur est survenue."
      );


      startButton.disabled =
        false;

    }

  }


  /* ============================================================
     EVENEMENTS
     ============================================================ */

  startButton.addEventListener(
    "click",
    startGame
  );


  guessButton.addEventListener(
    "click",
    submitGuess
  );


  pseudoInput.addEventListener(
    "keydown",
    event => {

      if (
        event.key === "Enter"
      ) {

        startGame();

      }

    }
  );


  document.addEventListener("keydown", event => {
    if (gameFinished || gameSection.classList.contains("hidden")) return;

    if (/^[a-zA-ZÀ-ÿ]$/.test(event.key)) {
      event.preventDefault();
      const letter = normalizeWord(event.key);
      if (letter) enterLetter(letter);
      return;
    }

    if (event.key === "Backspace") {
      event.preventDefault();
      eraseLetter();
      return;
    }

    if (event.key === "Enter") {
      event.preventDefault();
      submitGuess();
      return;
    }

    if (event.key === "ArrowLeft") {
      event.preventDefault();
      const prefix = getKnownPrefix();
      activePosition = Math.max(prefix.length, activePosition - 1);
      renderGuessBoxes();
      renderVirtualKeyboard();
    }

    if (event.key === "ArrowRight") {
      event.preventDefault();
      activePosition = Math.min(wordLength - 1, activePosition + 1);
      renderGuessBoxes();
      renderVirtualKeyboard();
    }
  });

  backspaceButton.addEventListener("click", eraseLetter);

  /* ============================================================
     RESTAURATION DU PSEUDO
     ============================================================ */

  const savedPseudo =
    localStorage.getItem(
      "dicoPseudo"
    );


  if (savedPseudo) {

    pseudoInput.value =
      savedPseudo;

  }

</script>
